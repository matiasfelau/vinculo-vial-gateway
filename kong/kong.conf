# ─────────────────────────────────────────────────────────────────────────────
# Kong — configuración de la instancia (vinculo-vial-gateway)
#
# Los valores estáticos de plataforma viven acá; los que cambian por entorno
# (puertos publicados, URL del upstream, secretos) se inyectan por variables
# de entorno KONG_* desde docker-compose.yml, que tienen precedencia sobre
# este archivo.
# ─────────────────────────────────────────────────────────────────────────────

# ── Modo de operación ────────────────────────────────────────────────────────
# DB-less: toda la configuración (Services, Routes, Plugins) es declarativa.
# No hay Postgres ni Admin API de escritura.
database = off
declarative_config = /tmp/kong.declarative.yml

# ── Listeners ────────────────────────────────────────────────────────────────
# Proxy: único punto de entrada público de la plataforma.
proxy_listen = 0.0.0.0:8000

# Admin API apagada. En DB-less la configuración es inmutable en runtime, así
# que no cumple ninguna función operativa: lo único que se le pedía era el
# healthcheck, y para eso está el Status API. Apagarla elimina la superficie
# por completo, en vez de depender de que quien despliegue se acuerde de no
# publicar el puerto.
admin_listen = off
admin_gui_listen = off

# Status API: expone `/status` y `/metrics`, de sólo lectura, sin ninguna
# operación de configuración. Es lo que consume el healthcheck del contenedor.
status_listen = 0.0.0.0:8100

# ── Logging ──────────────────────────────────────────────────────────────────
# A stdout/stderr para que lo recolecte el runtime de contenedores.
# El body nunca se loguea (viaja cifrado E2E) y no se emite PII.
proxy_access_log = /dev/stdout
proxy_error_log = /dev/stderr
admin_access_log = /dev/stdout
admin_error_log = /dev/stderr
log_level = notice

# ── Endurecimiento perimetral ────────────────────────────────────────────────
# No exponer versión ni headers internos de Kong hacia el cliente.
headers = off
# Techo de tamaño de request: el payload de signup es un sobre HPKE chico.
#
# El buffer tiene que ser >= al máximo: `app-attestation` calcula el SHA-256 del
# body para compararlo contra el `requestHash` del veredicto, y si el body no
# entra en el buffer nginx lo vuelca a un archivo temporal, donde el PDK ya no
# lo puede leer. Con el buffer más chico que el máximo, todo request grande
# sería rechazado por una desconfiguración y no por un problema real.
nginx_http_client_max_body_size = 1m
nginx_http_client_body_buffer_size = 1m

# Memoria compartida entre workers para el plugin `app-attestation`: cachea el
# access token de Google (para no pedir uno por request) y registra las
# atestaciones ya consumidas (protección anti-replay).
nginx_http_lua_shared_dict = vv_attestation 16m

# ── IP real del cliente ──────────────────────────────────────────────────────
# El rate limiting global cuenta por IP de cliente. Si el Gateway queda detrás
# de un balanceador o un ingress, la IP del peer es la del balanceador: todo el
# tráfico caería en un único contador y un solo cliente podría agotar la cuota
# de la plataforma entera.
#
# Estos valores se sobreescriben por entorno con `KONG_TRUSTED_IPS` y
# `KONG_REAL_IP_HEADER`. `trusted_ips` vacío es lo correcto cuando el Gateway
# está expuesto directamente: sin proxies de confianza, un `X-Forwarded-For`
# que mande el cliente se ignora y no puede falsear su IP para evadir el
# límite.
trusted_ips =
real_ip_header = X-Forwarded-For
real_ip_recursive = on

# ── Plugins habilitados ──────────────────────────────────────────────────────
# `bundled` son los nativos de Kong; el resto son los plugins Lua propios que
# la imagen copia a `lua_package_path`.
plugins = bundled,app-attestation,token-offloading
