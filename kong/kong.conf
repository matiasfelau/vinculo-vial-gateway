# ─────────────────────────────────────────────────────────────────────────────
# Kong — configuración de la instancia (vinculo-vial-gateway)
#
# Los valores estáticos de plataforma viven acá; los que cambian por entorno
# (puertos publicados, URL del upstream, secretos) se inyectan por variables
# de entorno KONG_* desde docker-compose.yml, que tienen precedencia sobre
# este archivo.
# ─────────────────────────────────────────────────────────────────────────────

# ── Modo de operación ────────────────────────────────────────────────────────
# DB-less: toda la configuración (Services, Routes, Plugins) es declarativa.
# No hay Postgres ni Admin API de escritura.
database = off
declarative_config = /tmp/kong.declarative.yml

# ── Listeners ────────────────────────────────────────────────────────────────
# Proxy: único punto de entrada público de la plataforma.
proxy_listen = 0.0.0.0:8000
# Admin API: se usa sólo para el healthcheck (`GET /status`). En DB-less es de
# lectura, y docker-compose la publica exclusivamente en 127.0.0.1.
admin_listen = 0.0.0.0:8001
admin_gui_listen = off
status_listen = off

# ── Logging ──────────────────────────────────────────────────────────────────
# A stdout/stderr para que lo recolecte el runtime de contenedores.
# El body nunca se loguea (viaja cifrado E2E) y no se emite PII.
proxy_access_log = /dev/stdout
proxy_error_log = /dev/stderr
admin_access_log = /dev/stdout
admin_error_log = /dev/stderr
log_level = notice

# ── Endurecimiento perimetral ────────────────────────────────────────────────
# No exponer versión ni headers internos de Kong hacia el cliente.
headers = off
# Techo de tamaño de request: el payload de signup es un sobre HPKE chico.
nginx_http_client_max_body_size = 1m
nginx_http_client_body_buffer_size = 128k

# ── Plugins habilitados ──────────────────────────────────────────────────────
# Los plugins custom en Lua se agregan a esta lista al integrarse.
plugins = bundled
