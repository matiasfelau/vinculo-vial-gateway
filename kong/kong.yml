# ─────────────────────────────────────────────────────────────────────────────
# Configuración declarativa de Kong (modo DB-less).
#
# Este archivo es una plantilla: los placeholders ${VARIABLE} se resuelven en
# el arranque del contenedor (docker/entrypoint.sh) contra las variables de
# entorno, y el resultado se escribe en `declarative_config` (kong.conf).
# Nunca se versionan secretos acá.
# ─────────────────────────────────────────────────────────────────────────────
_format_version: "3.0"
_transform: true

# ── Upstreams ────────────────────────────────────────────────────────────────
# Uno por Service, con healthchecks activos y pasivos. La salud de la
# instancia la decide el activo: prueba `/ready` (que cada servicio resuelve
# contra su base propia, nada más) directo contra el target —nunca a través
# del proxy, así que no necesita (ni puede tener) una Route— al igual que
# `/internal/*`, no es tráfico público; detecta una caída aunque no haya
# tráfico real.
#
# El pasivo observa el tráfico real que ya proxea el Gateway, pero sólo
# cuenta fallas de transporte (error de conexión y timeout), NUNCA el status
# HTTP (`http_failures: 0`). Un 503 emitido por un servicio es contención por
# ruta —una dependencia caída detrás de su propio breaker—, no una instancia
# enferma: si contara, sacaría del balanceo a la instancia entera y con ella
# a todas las rutas que sí funcionan (RENAPER caído → signup 503 → Identity
# fuera del balanceo → se cae también signin).
#
# Kong no tiene un "tiempo de apertura" separado como otros circuit breakers:
# un target marcado no sano se vuelve a probar cada
# UPSTREAM_HEALTHCHECK_INTERVAL_SECONDS (`unhealthy.interval`), y recién
# vuelve a sano tras acumular UPSTREAM_HEALTHCHECK_HEALTHY_THRESHOLD éxitos
# consecutivos. La duración de apertura es ese intervalo multiplicado por ese
# umbral, no un valor propio. Ese intervalo nunca puede ser 0 (el entrypoint
# lo rechaza): sin sondeo, un target marcado por el activo o por el pasivo no
# vuelve jamás. `healthy.interval` (UPSTREAM_HEALTHCHECK_HEALTHY_INTERVAL_SECONDS)
# es independiente: rige el sondeo de los targets sanos, y tampoco puede ser 0
# fuera de GATEWAY_TEST_MODE: sin sondearlos, un servicio con su base caída que
# responde 503 nunca saldría del balanceo, y la salud la decide /ready.
upstreams:
  - name: identity-upstream
    targets:
      - target: ${IDENTITY_SERVICE_TARGET}
    healthchecks:
      active:
        type: http
        http_path: /ready
        timeout: ${UPSTREAM_HEALTHCHECK_TIMEOUT_SECONDS}
        healthy:
          interval: ${UPSTREAM_HEALTHCHECK_HEALTHY_INTERVAL_SECONDS}
          successes: ${UPSTREAM_HEALTHCHECK_HEALTHY_THRESHOLD}
          http_statuses: [200]
        unhealthy:
          interval: ${UPSTREAM_HEALTHCHECK_INTERVAL_SECONDS}
          http_failures: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          tcp_failures: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          timeouts: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          http_statuses: [500, 501, 502, 503, 504, 505]
      passive:
        type: http
        healthy:
          successes: ${UPSTREAM_HEALTHCHECK_HEALTHY_THRESHOLD}
          http_statuses: [200, 201, 202, 203, 204, 205, 206, 207, 208, 226,
                          300, 301, 302, 303, 304, 305, 306, 307, 308]
        unhealthy:
          http_failures: 0
          tcp_failures: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          timeouts: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}

  - name: vehicle-upstream
    targets:
      - target: ${VEHICLE_SERVICE_TARGET}
    healthchecks:
      active:
        type: http
        http_path: /ready
        timeout: ${UPSTREAM_HEALTHCHECK_TIMEOUT_SECONDS}
        healthy:
          interval: ${UPSTREAM_HEALTHCHECK_HEALTHY_INTERVAL_SECONDS}
          successes: ${UPSTREAM_HEALTHCHECK_HEALTHY_THRESHOLD}
          http_statuses: [200]
        unhealthy:
          interval: ${UPSTREAM_HEALTHCHECK_INTERVAL_SECONDS}
          http_failures: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          tcp_failures: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          timeouts: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          http_statuses: [500, 501, 502, 503, 504, 505]
      passive:
        type: http
        healthy:
          successes: ${UPSTREAM_HEALTHCHECK_HEALTHY_THRESHOLD}
          http_statuses: [200, 201, 202, 203, 204, 205, 206, 207, 208, 226,
                          300, 301, 302, 303, 304, 305, 306, 307, 308]
        unhealthy:
          http_failures: 0
          tcp_failures: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          timeouts: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}

  - name: alert-upstream
    targets:
      - target: ${ALERT_SERVICE_TARGET}
    healthchecks:
      active:
        type: http
        http_path: /ready
        timeout: ${UPSTREAM_HEALTHCHECK_TIMEOUT_SECONDS}
        healthy:
          interval: ${UPSTREAM_HEALTHCHECK_HEALTHY_INTERVAL_SECONDS}
          successes: ${UPSTREAM_HEALTHCHECK_HEALTHY_THRESHOLD}
          http_statuses: [200]
        unhealthy:
          interval: ${UPSTREAM_HEALTHCHECK_INTERVAL_SECONDS}
          http_failures: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          tcp_failures: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          timeouts: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          http_statuses: [500, 501, 502, 503, 504, 505]
      passive:
        type: http
        healthy:
          successes: ${UPSTREAM_HEALTHCHECK_HEALTHY_THRESHOLD}
          http_statuses: [200, 201, 202, 203, 204, 205, 206, 207, 208, 226,
                          300, 301, 302, 303, 304, 305, 306, 307, 308]
        unhealthy:
          http_failures: 0
          tcp_failures: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          timeouts: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}

  - name: notification-upstream
    targets:
      - target: ${NOTIFICATION_SERVICE_TARGET}
    healthchecks:
      active:
        type: http
        http_path: /ready
        timeout: ${UPSTREAM_HEALTHCHECK_TIMEOUT_SECONDS}
        healthy:
          interval: ${UPSTREAM_HEALTHCHECK_HEALTHY_INTERVAL_SECONDS}
          successes: ${UPSTREAM_HEALTHCHECK_HEALTHY_THRESHOLD}
          http_statuses: [200]
        unhealthy:
          interval: ${UPSTREAM_HEALTHCHECK_INTERVAL_SECONDS}
          http_failures: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          tcp_failures: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          timeouts: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          http_statuses: [500, 501, 502, 503, 504, 505]
      passive:
        type: http
        healthy:
          successes: ${UPSTREAM_HEALTHCHECK_HEALTHY_THRESHOLD}
          http_statuses: [200, 201, 202, 203, 204, 205, 206, 207, 208, 226,
                          300, 301, 302, 303, 304, 305, 306, 307, 308]
        unhealthy:
          http_failures: 0
          tcp_failures: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          timeouts: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}

  - name: benefits-upstream
    targets:
      - target: ${BENEFITS_SERVICE_TARGET}
    healthchecks:
      active:
        type: http
        http_path: /ready
        timeout: ${UPSTREAM_HEALTHCHECK_TIMEOUT_SECONDS}
        healthy:
          interval: ${UPSTREAM_HEALTHCHECK_HEALTHY_INTERVAL_SECONDS}
          successes: ${UPSTREAM_HEALTHCHECK_HEALTHY_THRESHOLD}
          http_statuses: [200]
        unhealthy:
          interval: ${UPSTREAM_HEALTHCHECK_INTERVAL_SECONDS}
          http_failures: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          tcp_failures: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          timeouts: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          http_statuses: [500, 501, 502, 503, 504, 505]
      passive:
        type: http
        healthy:
          successes: ${UPSTREAM_HEALTHCHECK_HEALTHY_THRESHOLD}
          http_statuses: [200, 201, 202, 203, 204, 205, 206, 207, 208, 226,
                          300, 301, 302, 303, 304, 305, 306, 307, 308]
        unhealthy:
          http_failures: 0
          tcp_failures: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}
          timeouts: ${UPSTREAM_HEALTHCHECK_UNHEALTHY_THRESHOLD}

services:
  # ── vinculo-vial-identity ──────────────────────────────────────────────────
  # Servicio de identidad: registro, autenticación y gestión de usuarios.
  - name: identity-service
    # `host` referencia el Upstream de arriba por nombre, no una URL directa:
    # es lo que habilita el balanceo con healthchecks. protocol/port vienen
    # del mismo origen que su target (ver entrypoint.sh: derive_url_parts).
    protocol: ${IDENTITY_SERVICE_PROTOCOL}
    host: identity-upstream
    port: ${IDENTITY_SERVICE_PORT}
    # El registro es una operación no idempotente (crea un usuario): sólo se
    # reintenta ante fallos de conexión, nunca ante una respuesta del upstream.
    retries: 1
    # Presupuesto de latencia del Gateway por request: 12000ms en el peor
    # caso (2 × connect_timeout, por el reintento ante fallo de conexión, más
    # read_timeout; write_timeout no cuenta porque mide tiempo ENTRE
    # escrituras sucesivas al upstream, no la transferencia total — con el
    # body ya bufferizado por Kong antes de reenviarlo, la selfie de signup
    # viaja por red interna en pocas escrituras consecutivas y no lo
    # dispara). Las Routes de este Service además cargan `app-attestation`
    # (hasta 4000ms agregados contra Google): connect_timeout y read_timeout
    # se acotan más que en el resto para dejarle ese margen.
    connect_timeout: 1000
    write_timeout: 6000
    read_timeout: 6000
    routes:
      # US-01 — Registro. El body es un sobre HPKE: el Gateway no lo inspecciona
      # ni lo modifica, sólo lo reenvía.
      - name: identity-signup
        methods:
          - POST
        paths:
          - /api/v1/auth/signup
        # La ruta pública y la del upstream son idénticas: no se recorta el path.
        strip_path: false
        # El upstream recibe su propio Host, no el del cliente.
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          # Techo de tamaño específico de esta Route, más ajustado que el piso
          # global de nginx (kong.conf). Deliberadamente por Route y no global:
          # Kong corre TODAS las instancias de un mismo plugin que apliquen a
          # una request (global + Route no es "el más específico gana", son
          # las dos), así que un `request-size-limiting` global sumado a éste
          # limitaría todo por el menor de los dos. Mismo motivo que
          # `rate-limiting` es sólo global y `app-attestation` es sólo por
          # Route.
          #
          # Prioridad nativa 951: corre antes que `rate-limiting` (910) y que
          # `app-attestation` (900), así que un body de más de
          # `SIGNUP_MAX_BODY_MB` se rechaza sin gastar cuota de rate limit ni
          # una llamada a Google.
          - name: request-size-limiting
            config:
              allowed_payload_size: ${SIGNUP_MAX_BODY_MB}
              size_unit: megabytes
              require_content_length: false

          # Esta Route no tiene `token-offloading`, así que nada más
          # descartaría un `X-User-Hash`/`X-User-Id` que un cliente mande
          # desde afuera — ver "Headers de identidad" en el README. Antes
          # era un `request-transformer` global (una sola instancia para
          # toda la plataforma); pasó a declararse por Route, igual que el
          # resto de los plugins, porque un global corría en prioridad 801,
          # entre `rate-limiting` (910) y `token-offloading`, y esa posición
          # fija impedía subir la prioridad de `token-offloading` por encima
          # de `rate-limiting` sin que este plugin le borrara el header
          # recién escrito antes de reenviar al upstream (US-05).
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Hash
                  - X-User-Id

          # Seguridad perimetral: sin una atestación válida de Play Integrity
          # la request no alcanza la red interna.
          - name: app-attestation
            config:
              source: ${ATTESTATION_SOURCE}
              package_name: ${PLAY_PACKAGE_NAME}
              service_account_path: ${GOOGLE_SERVICE_ACCOUNT_PATH}
              playintegrity_url: ${PLAY_INTEGRITY_URL}
              ssl_verify: ${ATTESTATION_SSL_VERIFY}
              # Sólo se usa con source = mock (CI y desarrollo aislado).
              psk: "${APP_ATTESTATION_PSK}"
              accepted_app_verdicts: ${ATTESTATION_APP_VERDICTS}
              accepted_device_verdicts: ${ATTESTATION_DEVICE_VERDICTS}
              max_age_seconds: ${ATTESTATION_MAX_AGE_SECONDS}
              request_hash_encoding: ${ATTESTATION_REQUEST_HASH_ENCODING}
              # Presupuesto agregado del par OAuth + decodeIntegrityToken, y
              # techo de cada llamada individual dentro de ese agregado — ver
              # sources/google.fetch.
              dependency_timeout_ms: ${ATTESTATION_DEPENDENCY_TIMEOUT_MS}
              dependency_call_timeout_ms: ${ATTESTATION_DEPENDENCY_CALL_TIMEOUT_MS}

      # US-02 — Login. Mismo esquema de body que signup: sobre HPKE, el
      # Gateway no lo inspecciona ni lo modifica, sólo lo reenvía. Identity
      # emite el Access Token (JWT RS256, 15 min) y el Refresh Token (opaco,
      # 30 días) — el Gateway no participa de esa emisión, sólo perimetra el
      # endpoint.
      - name: identity-signin
        methods:
          - POST
        paths:
          - /api/v1/auth/signin
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          # Techo propio, más chico que el de signup: este body no lleva una
          # selfie, sólo credenciales. Mismo motivo que en signup para correr
          # antes que `app-attestation` — un límite bajo en bytes es barato de
          # aplicar y evita gastar una llamada a Google en un body imposible.
          - name: request-size-limiting
            config:
              allowed_payload_size: ${SIGNIN_MAX_BODY_KB}
              size_unit: kilobytes
              require_content_length: false

          # Igual que en signup: sin `token-offloading`, esta Route necesita
          # su propio descarte de `X-User-Hash`/`X-User-Id` (ver comentario
          # equivalente en `identity-signup`, más arriba).
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Hash
                  - X-User-Id

          # Mismo perímetro que signup: el login es, si no más, un blanco
          # igual de natural de fuerza bruta y credential stuffing, y encima
          # es el endpoint que primero emite tokens de sesión.
          - name: app-attestation
            config:
              source: ${ATTESTATION_SOURCE}
              package_name: ${PLAY_PACKAGE_NAME}
              service_account_path: ${GOOGLE_SERVICE_ACCOUNT_PATH}
              playintegrity_url: ${PLAY_INTEGRITY_URL}
              ssl_verify: ${ATTESTATION_SSL_VERIFY}
              # Sólo se usa con source = mock (CI y desarrollo aislado).
              psk: "${APP_ATTESTATION_PSK}"
              accepted_app_verdicts: ${ATTESTATION_APP_VERDICTS}
              accepted_device_verdicts: ${ATTESTATION_DEVICE_VERDICTS}
              max_age_seconds: ${ATTESTATION_MAX_AGE_SECONDS}
              request_hash_encoding: ${ATTESTATION_REQUEST_HASH_ENCODING}
              # Presupuesto agregado del par OAuth + decodeIntegrityToken, y
              # techo de cada llamada individual dentro de ese agregado — ver
              # sources/google.fetch.
              dependency_timeout_ms: ${ATTESTATION_DEPENDENCY_TIMEOUT_MS}
              dependency_call_timeout_ms: ${ATTESTATION_DEPENDENCY_CALL_TIMEOUT_MS}

      # US-03 — Gestión de Sesión (RTR). El body es `{ "refresh_token": "<...>" }`,
      # un string opaco SIN el sobre HPKE de signup/signin: la confidencialidad
      # la aporta HTTPS, no el Gateway. Identity emite un par nuevo (Access +
      # Refresh Token, rotado) o responde 401/403 — el Gateway no participa de
      # esa lógica, sólo perimetra el endpoint.
      - name: identity-refresh
        methods:
          - POST
        paths:
          - /api/v1/auth/refresh
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          # Igual que en signup/signin: sin `token-offloading`, esta Route
          # necesita su propio descarte de `X-User-Hash`/`X-User-Id` (ver
          # comentario equivalente en `identity-signup`, más arriba).
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Hash
                  - X-User-Id

          # Mismo perímetro que signup/signin: emitir un par de tokens de
          # sesión nuevo amerita la misma exigencia de atestación.
          - name: app-attestation
            config:
              source: ${ATTESTATION_SOURCE}
              package_name: ${PLAY_PACKAGE_NAME}
              service_account_path: ${GOOGLE_SERVICE_ACCOUNT_PATH}
              playintegrity_url: ${PLAY_INTEGRITY_URL}
              ssl_verify: ${ATTESTATION_SSL_VERIFY}
              # Sólo se usa con source = mock (CI y desarrollo aislado).
              psk: "${APP_ATTESTATION_PSK}"
              accepted_app_verdicts: ${ATTESTATION_APP_VERDICTS}
              accepted_device_verdicts: ${ATTESTATION_DEVICE_VERDICTS}
              max_age_seconds: ${ATTESTATION_MAX_AGE_SECONDS}
              request_hash_encoding: ${ATTESTATION_REQUEST_HASH_ENCODING}
              # Presupuesto agregado del par OAuth + decodeIntegrityToken, y
              # techo de cada llamada individual dentro de ese agregado — ver
              # sources/google.fetch.
              dependency_timeout_ms: ${ATTESTATION_DEPENDENCY_TIMEOUT_MS}
              dependency_call_timeout_ms: ${ATTESTATION_DEPENDENCY_CALL_TIMEOUT_MS}

      # Deliberadamente SIN `app-attestation`: cerrar sesión es una acción de
      # seguridad del usuario, no una operación que emita credenciales nuevas.
      # Si el dispositivo perdiera su capacidad de atestar (o el mock/Play
      # Integrity fallara), el usuario tiene que poder revocar igual su propio
      # Refresh Token — lo contrario lo dejaría atrapado sin poder cerrar
      # sesión justo cuando más lo necesita (robo de dispositivo). El riesgo
      # residual es bajo: quien ya posee el token sólo puede invalidarlo, lo
      # cual no da acceso a nada.
      #
      # Regla del repo: `app-attestation` se declara siempre por Route, nunca
      # a nivel de Service — si estuviera en `identity-service`, se heredaría
      # también acá y no habría forma de eximir esta Route puntual.
      - name: identity-logout
        methods:
          - POST
        paths:
          - /api/v1/auth/logout
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          # Sin `app-attestation` pero igual sin `token-offloading`: sigue
          # necesitando su propio descarte de `X-User-Hash`/`X-User-Id` (ver
          # comentario equivalente en `identity-signup`, más arriba).
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Hash
                  - X-User-Id

      # ── US-13 — Verificación de email y recuperación de contraseña ───────
      # Cinco Routes públicas, sin `jwt` (el usuario todavía no tiene sesión o
      # la perdió), con el mismo perímetro que signup/signin: descarte de
      # `X-User-Hash`/`X-User-Id`, `app-attestation` y un techo de body por
      # Route. Los bodies son sobres HPKE: el Gateway no los inspecciona, sólo
      # los reenvía. Los timeouts son los del `identity-service` (los mismos de
      # signin/signup).
      #
      # Paths EXACTOS (regla del repo, US-08): `email-verifications` y
      # `password-resets` comparten prefijo con sus subrecursos `/confirm` y
      # `/complete`; un path de prefijo capturaría el subrecurso con el rate
      # limit y el techo de body del padre.
      #
      # `rate-limiting` por Route con `limit_by: ip`: son endpoints sin sesión,
      # así que la IP es la única clave posible. Corre en prioridad 910, antes
      # que `app-attestation` (900), para que el abuso no gaste llamadas a
      # Google. Se suma al límite global por IP (el más bajo de los dos corta
      # primero). En AWS, el límite por IP necesita `KONG_TRUSTED_IPS` con el
      # CIDR del balanceador; queda para esa etapa.
      - name: identity-email-verifications
        methods:
          - POST
        paths:
          - ~/api/v1/auth/email-verifications$
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: request-size-limiting
            config:
              allowed_payload_size: ${SIGNIN_MAX_BODY_KB}
              size_unit: kilobytes
              require_content_length: false
          - name: rate-limiting
            config:
              minute: 3
              hour: 10
              limit_by: ip
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Hash
                  - X-User-Id
          - name: app-attestation
            config:
              source: ${ATTESTATION_SOURCE}
              package_name: ${PLAY_PACKAGE_NAME}
              service_account_path: ${GOOGLE_SERVICE_ACCOUNT_PATH}
              playintegrity_url: ${PLAY_INTEGRITY_URL}
              ssl_verify: ${ATTESTATION_SSL_VERIFY}
              # Sólo se usa con source = mock (CI y desarrollo aislado).
              psk: "${APP_ATTESTATION_PSK}"
              accepted_app_verdicts: ${ATTESTATION_APP_VERDICTS}
              accepted_device_verdicts: ${ATTESTATION_DEVICE_VERDICTS}
              max_age_seconds: ${ATTESTATION_MAX_AGE_SECONDS}
              request_hash_encoding: ${ATTESTATION_REQUEST_HASH_ENCODING}
              dependency_timeout_ms: ${ATTESTATION_DEPENDENCY_TIMEOUT_MS}
              dependency_call_timeout_ms: ${ATTESTATION_DEPENDENCY_CALL_TIMEOUT_MS}

      - name: identity-email-verifications-confirm
        methods:
          - POST
        paths:
          - ~/api/v1/auth/email-verifications/confirm$
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: request-size-limiting
            config:
              allowed_payload_size: ${SIGNIN_MAX_BODY_KB}
              size_unit: kilobytes
              require_content_length: false
          - name: rate-limiting
            config:
              minute: 10
              hour: 30
              limit_by: ip
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Hash
                  - X-User-Id
          - name: app-attestation
            config:
              source: ${ATTESTATION_SOURCE}
              package_name: ${PLAY_PACKAGE_NAME}
              service_account_path: ${GOOGLE_SERVICE_ACCOUNT_PATH}
              playintegrity_url: ${PLAY_INTEGRITY_URL}
              ssl_verify: ${ATTESTATION_SSL_VERIFY}
              # Sólo se usa con source = mock (CI y desarrollo aislado).
              psk: "${APP_ATTESTATION_PSK}"
              accepted_app_verdicts: ${ATTESTATION_APP_VERDICTS}
              accepted_device_verdicts: ${ATTESTATION_DEVICE_VERDICTS}
              max_age_seconds: ${ATTESTATION_MAX_AGE_SECONDS}
              request_hash_encoding: ${ATTESTATION_REQUEST_HASH_ENCODING}
              dependency_timeout_ms: ${ATTESTATION_DEPENDENCY_TIMEOUT_MS}
              dependency_call_timeout_ms: ${ATTESTATION_DEPENDENCY_CALL_TIMEOUT_MS}

      - name: identity-password-resets
        methods:
          - POST
        paths:
          - ~/api/v1/auth/password-resets$
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: request-size-limiting
            config:
              allowed_payload_size: ${SIGNIN_MAX_BODY_KB}
              size_unit: kilobytes
              require_content_length: false
          - name: rate-limiting
            config:
              minute: 3
              hour: 10
              limit_by: ip
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Hash
                  - X-User-Id
          - name: app-attestation
            config:
              source: ${ATTESTATION_SOURCE}
              package_name: ${PLAY_PACKAGE_NAME}
              service_account_path: ${GOOGLE_SERVICE_ACCOUNT_PATH}
              playintegrity_url: ${PLAY_INTEGRITY_URL}
              ssl_verify: ${ATTESTATION_SSL_VERIFY}
              # Sólo se usa con source = mock (CI y desarrollo aislado).
              psk: "${APP_ATTESTATION_PSK}"
              accepted_app_verdicts: ${ATTESTATION_APP_VERDICTS}
              accepted_device_verdicts: ${ATTESTATION_DEVICE_VERDICTS}
              max_age_seconds: ${ATTESTATION_MAX_AGE_SECONDS}
              request_hash_encoding: ${ATTESTATION_REQUEST_HASH_ENCODING}
              dependency_timeout_ms: ${ATTESTATION_DEPENDENCY_TIMEOUT_MS}
              dependency_call_timeout_ms: ${ATTESTATION_DEPENDENCY_CALL_TIMEOUT_MS}

      - name: identity-password-resets-confirm
        methods:
          - POST
        paths:
          - ~/api/v1/auth/password-resets/confirm$
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: request-size-limiting
            config:
              allowed_payload_size: ${SIGNIN_MAX_BODY_KB}
              size_unit: kilobytes
              require_content_length: false
          - name: rate-limiting
            config:
              minute: 10
              hour: 30
              limit_by: ip
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Hash
                  - X-User-Id
          - name: app-attestation
            config:
              source: ${ATTESTATION_SOURCE}
              package_name: ${PLAY_PACKAGE_NAME}
              service_account_path: ${GOOGLE_SERVICE_ACCOUNT_PATH}
              playintegrity_url: ${PLAY_INTEGRITY_URL}
              ssl_verify: ${ATTESTATION_SSL_VERIFY}
              # Sólo se usa con source = mock (CI y desarrollo aislado).
              psk: "${APP_ATTESTATION_PSK}"
              accepted_app_verdicts: ${ATTESTATION_APP_VERDICTS}
              accepted_device_verdicts: ${ATTESTATION_DEVICE_VERDICTS}
              max_age_seconds: ${ATTESTATION_MAX_AGE_SECONDS}
              request_hash_encoding: ${ATTESTATION_REQUEST_HASH_ENCODING}
              dependency_timeout_ms: ${ATTESTATION_DEPENDENCY_TIMEOUT_MS}
              dependency_call_timeout_ms: ${ATTESTATION_DEPENDENCY_CALL_TIMEOUT_MS}

      - name: identity-password-resets-complete
        methods:
          - POST
        paths:
          - ~/api/v1/auth/password-resets/complete$
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: request-size-limiting
            config:
              allowed_payload_size: ${SIGNUP_MAX_BODY_MB}
              size_unit: megabytes
              require_content_length: false
          - name: rate-limiting
            config:
              minute: 3
              hour: 10
              limit_by: ip
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Hash
                  - X-User-Id
          - name: app-attestation
            config:
              source: ${ATTESTATION_SOURCE}
              package_name: ${PLAY_PACKAGE_NAME}
              service_account_path: ${GOOGLE_SERVICE_ACCOUNT_PATH}
              playintegrity_url: ${PLAY_INTEGRITY_URL}
              ssl_verify: ${ATTESTATION_SSL_VERIFY}
              # Sólo se usa con source = mock (CI y desarrollo aislado).
              psk: "${APP_ATTESTATION_PSK}"
              accepted_app_verdicts: ${ATTESTATION_APP_VERDICTS}
              accepted_device_verdicts: ${ATTESTATION_DEVICE_VERDICTS}
              max_age_seconds: ${ATTESTATION_MAX_AGE_SECONDS}
              request_hash_encoding: ${ATTESTATION_REQUEST_HASH_ENCODING}
              dependency_timeout_ms: ${ATTESTATION_DEPENDENCY_TIMEOUT_MS}
              dependency_call_timeout_ms: ${ATTESTATION_DEPENDENCY_CALL_TIMEOUT_MS}

      # ── Scaffolding de Token Offloading ──────────────────────────────────
      # Ruta de ejemplo de un endpoint con sesión, para dejar el patrón
      # armado: no aplica a US-01/US-02/US-03 (signup, signin, refresh y
      # logout se autentican con el Refresh Token o no requieren sesión,
      # nunca con el Access Token entrante). El par `jwt` + `token-offloading`
      # es el que se replica en cada endpoint autenticado de la plataforma —
      # `vehicles-route` (US-04, más abajo) es el primer caso real.
      - name: identity-profile
        methods:
          - GET
        paths:
          - /api/v1/users/me
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          # Verifica la firma RS256 contra la clave pública de Identity.
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          # Traduce el `sub` ya validado a `X-User-Hash` y quita el
          # `Authorization` antes de reenviar.
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Hash
              remove_authorization: true

      # US-11 — Baja de cuenta. Comparte el path con el scaffold
      # `identity-profile` (GET), pero las separa el método: un `DELETE` nunca
      # puede matchear aquélla ni un `GET` ésta. Declara path exacto (regex
      # anclada con `$`) por la regla de US-08: un prefijo capturaría
      # `/api/v1/users/me/...` y lo sometería a este perímetro. El body es
      # `{ "password": "<string>" }`, la reautenticación de la baja: viaja sin
      # sobre HPKE (la confidencialidad la aporta HTTPS) y el Gateway no la
      # inspecciona ni la loguea (el access log no incluye bodies), sólo la
      # reenvía. La verificación (Argon2) y el 401 `INVALID_PASSWORD` son de
      # Identity. La baja es idempotente: responde 204 aunque el usuario ya no
      # exista, así que un reintento de Kong ante un fallo de conexión
      # (`retries` de `identity-service`) es inofensivo.
      #
      # Deliberadamente SIN `app-attestation`, con el mismo criterio que las
      # Routes de alertas: la defensa es la contraseña actual, que Identity
      # exige en cada llamada, más el `rate-limiting` por usuario de abajo,
      # que acota los intentos de adivinarla con un JWT robado. Regla del
      # repo: `app-attestation` se declara siempre por Route, nunca a nivel
      # de Service, así que no se hereda de `identity-service`.
      - name: users-me-delete-route
        methods:
          - DELETE
        paths:
          - ~/api/v1/users/me$
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          # Mismo par que `alerts-inbox-route`: verifica la firma RS256 del
          # Access Token e inyecta `X-User-Id` a partir del `sub` ya validado,
          # quitando el `Authorization` antes de reenviar. Distinto del
          # scaffold de arriba, que escribe `X-User-Hash`: Identity lee
          # `X-User-Id` para saber a quién dar de baja. Corre en PRIORITY 1000,
          # por encima de `rate-limiting` (910), para que el header ya exista
          # cuando éste lee `limit_by: header`, y es la única protección
          # contra un `X-User-Id` forjado por el cliente en esta Route.
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true
          # El body es una contraseña: 1 KB sobra y acota lo que se reenvía,
          # igual que en feedback y report. Es el límite propio de la Route; el
          # techo global de nginx no lo reemplaza.
          - name: request-size-limiting
            config:
              allowed_payload_size: 1
              size_unit: kilobytes
              require_content_length: false
          # 3/min y 10/h por `X-User-Id`: la baja es irreversible y se hace
          # una vez en la vida de la cuenta, así que el uso legítimo cabe
          # holgado y el resto es abuso o fuerza bruta de la contraseña. El
          # cupo es independiente por usuario: dos usuarios nunca comparten
          # contador.
          - name: rate-limiting
            config:
              minute: 3
              hour: 10
              limit_by: header
              header_name: X-User-Id
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"

  # ── vinculo-vial-vehicle ────────────────────────────────────────────────────
  # US-04 — Vinculación de Vehículo. Primer CU con Token Offloading real: el
  # body es un sobre HPKE con cifrado diferenciado (`dni_enc` para Identity,
  # `pat_enc` para Vehicle) que el Gateway no inspecciona ni modifica, sólo
  # reenvía. `/internal/verify-ownership` (Vehicle → Identity) es tráfico
  # interno directo, nunca una Route de Kong — ver más abajo.
  - name: vehicle-service
    # Mismo criterio que `identity-service`: `host` referencia su Upstream
    # por nombre para habilitar el balanceo con healthchecks.
    protocol: ${VEHICLE_SERVICE_PROTOCOL}
    host: vehicle-upstream
    port: ${VEHICLE_SERVICE_PORT}
    # La vinculación de vehículo es una operación no idempotente (crea el
    # registro de vinculación): mismo criterio que `identity-service`, sólo se
    # reintenta ante fallos de conexión, nunca ante una respuesta del upstream.
    retries: 1
    # Presupuesto de 12000ms en el peor caso (2 × connect_timeout +
    # read_timeout), igual que `identity-service`, pero sin repartir margen
    # con ninguna dependencia externa: esta Route no carga `app-attestation`.
    connect_timeout: 1000
    write_timeout: 9000
    read_timeout: 9000
    routes:
      - name: vehicles-route
        methods:
          - POST
        # Path exacto (regex anclada con `$`): un path de prefijo capturaría
        # también cualquier subrecurso, p. ej. el viejo `/api/v1/vehicles/check`
        # (eliminado en US-08: el check ahora lo hace Alert con el intento).
        # Ese path ya no tiene Route y Kong responde 404.
        paths:
          - ~/api/v1/vehicles$
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          # Verifica la firma RS256 del Access Token contra la clave pública
          # de Identity. Mismo par jwt + token-offloading que el scaffold de
          # /users/me, ahora en su primer uso real.
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          # Traduce el `sub` ya validado a `X-User-Id` y quita el
          # `Authorization` antes de reenviar. Es la ÚNICA protección contra
          # spoofing de este header en esta Route —no hay además un
          # `request-transformer` global ni por Route—: el propio plugin
          # descarta cualquier `X-User-Id` entrante antes de escribir el suyo
          # (kong/plugins/token-offloading/handler.lua), en un único
          # `access()` atómico. Sin eso, un atacante podría mandar su propio
          # `X-User-Id` y vincular un vehículo a la cuenta de otro usuario.
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true

      # US-14 — Vinculación por dominio: conteo y desvinculación. Las tres
      # Routes que siguen comparten el path `/api/v1/vehicles` con
      # `vehicles-route` (el alta, que no se toca), pero las separa el método
      # (GET y DELETE) o el sufijo exacto (`/unlink`). Cada una declara path
      # exacto (regex anclada con `$`) por la regla de US-08: un prefijo
      # capturaría subrecursos como el viejo `/api/v1/vehicles/check` y los
      # sometería a este perímetro. Ninguna respuesta de Vehicle lleva
      # patentes —sólo `{ "count", "max" }` o un 204—, y el Gateway no
      # transforma las respuestas ni inspecciona los bodies: el `payload_enc`
      # de `unlink` es un sobre HPKE que sólo abre Vehicle.
      #
      # Mismo criterio que el alta: deliberadamente SIN `app-attestation`
      # (se declara siempre por Route, nunca por Service, así que no se hereda
      # de `vehicle-service`). La defensa es el JWT más el `rate-limiting` por
      # usuario de cada una. Corren con el par jwt + token-offloading de
      # `vehicles-route`; `token-offloading` está en PRIORITY 1000, por encima
      # de `rate-limiting` (910), para que `X-User-Id` exista cuando éste lee
      # `limit_by: header`, y es la única protección contra un `X-User-Id`
      # forjado por el cliente en estas Routes.

      # Cuántos vehículos tiene vinculados el usuario de la sesión. Lectura
      # idempotente y sin efectos, que sólo devuelve un contador propio:
      # 30/min por `X-User-Id`.
      - name: vehicles-count-route
        methods:
          - GET
        paths:
          - ~/api/v1/vehicles$
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true
          - name: rate-limiting
            config:
              minute: 30
              limit_by: header
              header_name: X-User-Id
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"

      # Desvincula una patente que el usuario vuelve a escribir. Responde 404
      # `VEHICLE_NOT_FOUND` si no la tiene vinculada, así que es un oráculo
      # de pertenencia sobre las propias vinculaciones (no sobre las de otros:
      # Vehicle sólo busca entre las del usuario de la sesión), y el uso
      # legítimo —corregir una patente mal cargada— es ocasional: 10/min y
      # 30/h por `X-User-Id`.
      - name: vehicles-unlink-route
        methods:
          - POST
        paths:
          - ~/api/v1/vehicles/unlink$
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true
          - name: rate-limiting
            config:
              minute: 10
              hour: 30
              limit_by: header
              header_name: X-User-Id
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"

      # Desvincula todos los vehículos del usuario: la salida para quien no
      # recuerda cómo escribió una patente. Sin body. Es destructiva y de
      # uso excepcional, igual que la baja de cuenta: 3/min y 10/h por
      # `X-User-Id`. Idempotente en Vehicle, así que un reintento de Kong ante
      # un fallo de conexión (`retries` de `vehicle-service`) es inofensivo.
      - name: vehicles-unlink-all-route
        methods:
          - DELETE
        paths:
          - ~/api/v1/vehicles$
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true
          - name: rate-limiting
            config:
              minute: 3
              hour: 10
              limit_by: header
              header_name: X-User-Id
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"

      # No existe ninguna Route que matchee `/internal/*`: el endpoint
      # interno `/internal/verify-ownership` (Vehicle → Identity) no se
      # expone en Kong a propósito, y una request a través del proxy tiene
      # que devolver 404 de Kong, sin llegar nunca a la red interna. La
      # ausencia de Route impide el acceso desde AFUERA, pero no aísla el
      # endpoint dentro de la red Docker — cualquier contenedor puede
      # llamar a Identity directamente; ese aislamiento es responsabilidad
      # de Identity (puerto interno separado y/o secreto servicio a
      # servicio, documentado en su propio CLAUDE.md). Kong cubre sólo la
      # mitad perimetral del problema.

  # ── vinculo-vial-alert ────────────────────────────────────────────────────
  # US-05 — Escaneo de Patente y Alerta Anónima. El body es
  # `{ "alert_type": "...", "pat_enc": "<cripto para Vehicle>" }`: el
  # Gateway no lo inspecciona ni modifica, sólo reenvía. `pat_enc` sólo lo
  # puede abrir Vehicle — Alert lo reenvía a ciegas a
  # `/internal/resolve-owner` por red interna directa, nunca a través de
  # una Route de Kong.
  #
  # US-07 — Buzón de Alertas (lectura), sobre el mismo Service: ver
  # `alerts-inbox-route`, más abajo.
  - name: alert-service
    # Mismo criterio que `identity-service`: `host` referencia su Upstream
    # por nombre para habilitar el balanceo con healthchecks.
    protocol: ${ALERT_SERVICE_PROTOCOL}
    host: alert-upstream
    port: ${ALERT_SERVICE_PORT}
    # El alta de alerta es una operación no idempotente: mismo criterio que
    # `identity-service`, sólo se reintenta ante fallos de conexión, nunca
    # ante una respuesta del upstream.
    retries: 1
    # Mismo presupuesto y mismo motivo que `vehicle-service`: 12000ms en el
    # peor caso, sin dependencia externa que repartir.
    connect_timeout: 1000
    write_timeout: 9000
    read_timeout: 9000
    routes:
      # Deliberadamente SIN `app-attestation`: decisión cerrada del
      # contrato de US-05, por velocidad. Sin esa capa, `rate-limiting`
      # por usuario deja de ser una cortesía operativa y pasa a ser la
      # única defensa contra abuso automatizado sobre este endpoint —
      # de ahí que corra con un límite mucho más estricto que el
      # perimetral por IP (plugin global, más abajo).
      - name: alerts-route
        methods:
          - POST
        # Path exacto (regex anclada con `$`), no de prefijo: un prefijo
        # capturaría los subrecursos de otros endpoints de `/api/v1/alerts/...`
        # (US-08) y los sometería al perímetro de ésta.
        paths:
          - ~/api/v1/alerts$
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          # Mismo par que vehicles-route: verifica la firma RS256 del
          # Access Token contra la clave pública de Identity.
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          # Traduce el `sub` ya validado a `X-User-Id` y quita el
          # `Authorization` antes de reenviar. Corre en PRIORITY 1000
          # (kong/plugins/token-offloading/handler.lua) — por encima de
          # `rate-limiting` (910, nativo) — para que el header ya esté
          # escrito cuando ese plugin lea `limit_by: header` más abajo.
          # Es también la única protección contra spoofing de este header
          # en esta Route, igual que en vehicles-route.
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true
          # Anti-abuso por usuario, no por IP: sin `app-attestation`,
          # cualquiera con un JWT válido podría barrer el endpoint. El
          # cupo es independiente por `X-User-Id` — dos usuarios distintos
          # nunca comparten contador.
          # Multipart de la llamada 2 (metadata + fotos HPKE): cada parte es
          # ≤ 1 MiB y el body completo entra en 5 MB. Con
          # `client_body_buffer_size` en 5m (kong.conf) nginx lo mantiene en
          # memoria, y el Gateway sólo lo reenvía, sin inspeccionarlo. Es el
          # límite propio de la Route: el techo global de nginx no lo
          # reemplaza.
          - name: request-size-limiting
            config:
              allowed_payload_size: 5
              size_unit: megabytes
              require_content_length: false
          - name: rate-limiting
            config:
              minute: 5
              hour: 10
              limit_by: header
              header_name: X-User-Id
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"

      # US-07 — Buzón de Alertas (lectura). Comparte prefijo con
      # `alerts-route` (`/api/v1/alerts`), pero `alerts-route` es de path
      # exacto (US-08) y además declara `methods: [POST]`, así que un `GET`
      # nunca puede matchearla. Verificado también con un test de
      # integración dedicado.
      - name: alerts-inbox-route
        methods:
          - GET
        paths:
          - /api/v1/alerts/inbox
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          # Mismo par que alerts-route: verifica la firma RS256 del Access
          # Token e inyecta `X-User-Id` a partir del `sub` ya validado. La
          # paginación (`limit`/`cursor`) viaja en la query string sin que
          # el Gateway la toque: el recorte del `limit` al tope y la
          # validación del `cursor` son responsabilidad de Alert, no de
          # este perímetro.
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true
          # 20/min: más permisivo que los 5/min de alerts-route porque este
          # endpoint es de lectura, idempotente y sin efectos — y sólo
          # devuelve datos que ya pertenecen al usuario autenticado, a
          # diferencia de alerts-route, que sí necesita un límite estricto
          # por no tener `app-attestation` delante. Depende de la misma
          # PRIORITY=1000 de `token-offloading` que alerts-route: si ese
          # plugin corriera después de `rate-limiting`, el límite por
          # usuario degradaría en silencio a otro criterio.
          - name: rate-limiting
            config:
              minute: 20
              limit_by: header
              header_name: X-User-Id
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"

      # US-08 — Intento, evidencia, feedback y reporte. Todas cuelgan de
      # `alert-service` (timeouts sin cambios) y comparten el prefijo
      # `/api/v1/alerts` con `alerts-route`, así que cada una declara un
      # path exacto (regex anclada con `$`): ningún prefijo puede capturar
      # el subrecurso de otro endpoint. Mismo par jwt + token-offloading que
      # `alerts-route` (sin `app-attestation`, fuera de alcance de US-08);
      # `token-offloading` corre en PRIORITY 1000, antes que `rate-limiting`
      # (910), para que `X-User-Id` exista cuando éste lee `limit_by: header`.
      # `request-size-limiting` (951) corre antes que `rate-limiting`: un body
      # fuera de tope se rechaza con 413 sin gastar cupo.
      #
      # Ante un timeout del upstream Kong responde 504, mientras que el
      # contrato de US-08 usa 503 para las dependencias caídas. Es una
      # diferencia conocida y aceptada: no se reescribe en el Gateway.

      # Llamada 1: el intento. Responde si el vehículo está en la red, así
      # que es un oráculo de pertenencia de patentes: de ahí el rate limit
      # por `X-User-Id`. El body es `{ "pat_enc": "<base64>" }`.
      - name: alerts-attempts-route
        methods:
          - POST
        paths:
          - ~/api/v1/alerts/attempts$
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true
          - name: request-size-limiting
            config:
              allowed_payload_size: 8
              size_unit: kilobytes
              require_content_length: false
          - name: rate-limiting
            config:
              minute: 10
              hour: 30
              limit_by: header
              header_name: X-User-Id
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"

      # Evidencia redactada para el dueño de la alerta. Lectura: el Gateway
      # sólo reenvía la imagen que devuelve Alert, sin inspeccionarla ni
      # transformarla. Los roles e índices válidos se acotan en el path.
      - name: alerts-evidence-route
        methods:
          - GET
        paths:
          - '~/api/v1/alerts/[0-9a-fA-F-]{36}/evidence/(GENERAL|PLATE|DETAIL|CONTEXT)/[0-9]$'
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true
          - name: rate-limiting
            config:
              minute: 60
              limit_by: header
              header_name: X-User-Id
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"

      # Valoración (👍/👎) de la validación. Body: `{ "rating": "UP|DOWN" }`.
      - name: alerts-feedback-route
        methods:
          - PUT
        paths:
          - '~/api/v1/alerts/[0-9a-fA-F-]{36}/feedback$'
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true
          - name: request-size-limiting
            config:
              allowed_payload_size: 1
              size_unit: kilobytes
              require_content_length: false
          - name: rate-limiting
            config:
              minute: 30
              limit_by: header
              header_name: X-User-Id
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"

      # Reporte del emisor por el dueño. Cada reporte puede poner al emisor
      # en revisión, así que el límite es estricto. Body:
      # `{ "reason": "FALSE_ALERT|SPAM" }`.
      - name: alerts-report-route
        methods:
          - POST
        paths:
          - '~/api/v1/alerts/[0-9a-fA-F-]{36}/report$'
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true
          - name: request-size-limiting
            config:
              allowed_payload_size: 1
              size_unit: kilobytes
              require_content_length: false
          - name: rate-limiting
            config:
              minute: 5
              hour: 20
              limit_by: header
              header_name: X-User-Id
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"

      # US-09 — Buzón de Enviados. Mismas reglas que las de US-08: comparten el
      # prefijo `/api/v1/alerts` con `alerts-route`, así que declaran path
      # exacto (regex anclada con `$`), y el mismo par jwt + token-offloading
      # (PRIORITY 1000, antes que `rate-limiting`) para que `X-User-Id` exista
      # cuando éste lee `limit_by: header`. Sin `app-attestation`, igual que el
      # resto de las Routes de alertas.

      # Lista de alertas del emisor. Lectura idempotente que sólo devuelve
      # datos del usuario autenticado: mismo cupo que `alerts-inbox-route`. La
      # paginación (`limit`/`cursor`) viaja en la query string y la valida
      # Alert, no el Gateway.
      - name: alerts-sent-route
        methods:
          - GET
        paths:
          - ~/api/v1/alerts/sent$
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true
          - name: rate-limiting
            config:
              minute: 20
              limit_by: header
              header_name: X-User-Id
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"

      # El dueño marca la alerta como leída al abrir el chat. Idempotente y sin
      # body (responde 204), así que no lleva `request-size-limiting`.
      - name: alerts-seen-route
        methods:
          - PUT
        paths:
          - '~/api/v1/alerts/[0-9a-fA-F-]{36}/seen$'
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true
          - name: rate-limiting
            config:
              minute: 30
              limit_by: header
              header_name: X-User-Id
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"

      # Igual que con Vehicle: no existe ninguna Route que matchee
      # `/internal/*`. `/internal/resolve-owner` (Alert → Vehicle) es
      # tráfico interno directo, nunca expuesto en Kong.

  # ── vinculo-vial-notification ───────────────────────────────────────────────
  # US-06 — Registro y baja de tokens FCM. El body de POST es
  # `{ "fcm_token": "<...>" }`, sin cifrado propio: el token FCM no es un dato
  # sensible en el sentido HPKE del resto de la plataforma, así que el Gateway
  # lo reenvía intacto sin más tratamiento que el perímetro de sesión.
  - name: notification-service
    # Mismo criterio que `identity-service`: `host` referencia su Upstream
    # por nombre para habilitar el balanceo con healthchecks.
    protocol: ${NOTIFICATION_SERVICE_PROTOCOL}
    host: notification-upstream
    port: ${NOTIFICATION_SERVICE_PORT}
    # El alta de token FCM es una operación no idempotente: mismo criterio que
    # `identity-service`, sólo se reintenta ante fallos de conexión, nunca
    # ante una respuesta del upstream.
    retries: 1
    # Mismo presupuesto y mismo motivo que `vehicle-service`: 12000ms en el
    # peor caso, sin dependencia externa que repartir.
    connect_timeout: 1000
    write_timeout: 9000
    read_timeout: 9000
    routes:
      # Alta de token. Sin `app-attestation` — mismo criterio que /vehicles y
      # /alerts: la sesión (jwt + token-offloading) ya exige un Access Token
      # válido, y acá el rate-limiting por usuario cierra el resto del
      # perímetro (ver más abajo).
      - name: notification-tokens-post-route
        methods:
          - POST
        paths:
          - /api/v1/notifications/tokens
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          # Mismo par que vehicles-route y alerts-route: verifica la firma
          # RS256 del Access Token e inyecta `X-User-Id` a partir del `sub`
          # ya validado.
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true
          # 10/día: un token FCM rota con poca frecuencia (reinstalación,
          # restauración de backup, limpieza de datos de la app). Diez altas
          # diarias por usuario es holgado para el uso legítimo y acota el
          # abuso de escritura sobre este endpoint, que no tiene
          # `app-attestation` por delante. Depende de la misma PRIORITY=1000
          # de `token-offloading` que /alerts y /alerts/inbox: si ese plugin
          # corriera después de `rate-limiting`, el límite por usuario
          # degradaría en silencio a otro criterio (ver
          # `kong/plugins/token-offloading/handler.lua`).
          - name: rate-limiting
            config:
              day: 10
              limit_by: header
              header_name: X-User-Id
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"

      # Baja de token. Deliberadamente SIN `rate-limiting`: un límite
      # alcanzado acá deja al dispositivo recibiendo notificaciones que ya no
      # le corresponden — fuga de privacidad, no una molestia. Mismo criterio
      # que eximir `/auth/logout` de `app-attestation`. Route separada de la
      # de alta (no un único `POST`+`DELETE` compartido) precisamente para
      # que el rate-limiting de arriba no se herede también acá.
      - name: notification-tokens-delete-route
        methods:
          - DELETE
        paths:
          - /api/v1/notifications/tokens
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true

      # No existe ninguna Route que matchee `/internal/*`, mismo criterio que
      # en Vehicle y Alert.

  # ── vinculo-vial-benefits ───────────────────────────────────────────────────
  # US-18 — Beneficios con códigos de descuento de partners. Tres Routes de
  # sesión (jwt + token-offloading + rate-limiting por `X-User-Id`) que
  # atienden al usuario final: la lista de campañas vigentes, el banner de cada
  # una y el pedido del código (`claim`). Las respuestas pueden llevar el
  # código del usuario: el Gateway no las inspecciona ni transforma.
  - name: benefits-service
    # Mismo criterio que `identity-service`: `host` referencia su Upstream
    # por nombre para habilitar el balanceo con healthchecks.
    protocol: ${BENEFITS_SERVICE_PROTOCOL}
    host: benefits-upstream
    port: ${BENEFITS_SERVICE_PORT}
    # `claim` es idempotente (el mismo usuario recibe siempre el mismo código)
    # y las otras dos Routes son lecturas, así que el reintento ante un fallo
    # de conexión es inofensivo. Como en el resto, nunca se reintenta ante una
    # respuesta del upstream.
    retries: 1
    # Mismo presupuesto y mismo motivo que `vehicle-service`: 12000ms en el
    # peor caso, sin dependencia externa que repartir.
    connect_timeout: 1000
    write_timeout: 9000
    read_timeout: 9000
    routes:
      # Las tres Routes son deliberadamente SIN `app-attestation`, igual que
      # /vehicles, /alerts y /notifications: la defensa es el JWT más el
      # `rate-limiting` por usuario de cada una. Se declara siempre por Route,
      # nunca por Service. `token-offloading` (PRIORITY 1000) corre por encima
      # de `rate-limiting` (910, nativo) para que `X-User-Id` exista cuando
      # éste lee `limit_by: header`, y es la única protección contra un
      # `X-User-Id` forjado: sin él, un cliente podría pedir (y gastar del
      # pool de la campaña) el código a nombre de otro usuario.
      #
      # Los tres paths son exactos (regex anclada con `$`): un prefijo
      # capturaría subrecursos que no son de este perímetro. El `{id}` es un
      # UUID (`[0-9a-fA-F-]{36}`), como en `/alerts/{id}/...`.

      # Campañas vigentes del usuario, con su código si ya lo pidió. Lectura
      # sin efectos: 60/min por `X-User-Id`.
      - name: benefits-list-route
        methods:
          - GET
        paths:
          - ~/api/v1/benefits$
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true
          - name: rate-limiting
            config:
              minute: 60
              limit_by: header
              header_name: X-User-Id
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"
          # `token-offloading` sólo descarta `X-User-Id`: un `X-User-Hash`
          # forjado llegaría a Benefits. Se quita acá, y sólo ése: este plugin
          # corre después (801) y borraría el `X-User-Id` recién escrito.
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Hash

      # Imagen del banner (hasta BANNER_MAX_BYTES). La app baja uno por
      # campaña al abrir el carrusel y revalida por `ETag` (304): 120/min por
      # `X-User-Id`, el doble que la lista porque cada carga de la lista
      # dispara tantos pedidos como campañas haya.
      - name: benefits-banner-route
        methods:
          - GET
        paths:
          - '~/api/v1/benefits/[0-9a-fA-F-]{36}/banner$'
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true
          - name: rate-limiting
            config:
              minute: 120
              limit_by: header
              header_name: X-User-Id
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Hash

      # Pedido del código. Es lo único que gasta el pool de la campaña y
      # responde `409 NO_CODES_LEFT` o `404 BENEFIT_NOT_FOUND`, así que se
      # acota fuerte: 10/min y 30/h por `X-User-Id`. Es idempotente, por lo
      # que el uso legítimo es de un pedido por campaña.
      - name: benefits-claim-route
        methods:
          - POST
        paths:
          - '~/api/v1/benefits/[0-9a-fA-F-]{36}/claim$'
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true
          - name: rate-limiting
            config:
              minute: 10
              hour: 30
              limit_by: header
              header_name: X-User-Id
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Hash

      # No existe ninguna Route que matchee `/admin/*` ni `/internal/*`: el
      # router de administración de Benefits (puerto propio, `X-Admin-Api-Key`)
      # no se expone en Kong, y una request a través del proxy tiene que
      # devolver 404 de Kong sin llegar nunca a la red interna.

# ── Consumers ────────────────────────────────────────────────────────────────
# En este modelo el emisor de los tokens es Identity, no cada usuario final: el
# Gateway sólo necesita la clave pública para verificar la firma, y la
# identidad del usuario viaja en el claim `sub`.
consumers:
  - username: vinculo-vial-identity
    jwt_secrets:
      - key: ${JWT_ISSUER}
        algorithm: RS256
        rsa_public_key: "${JWT_PUBLIC_KEY}"

# ── Plugins globales ─────────────────────────────────────────────────────────
# Sin `service` ni `route` asociados: aplican a todo el tráfico que atraviesa el
# Gateway, para toda la plataforma.
plugins:
  # Identificador de correlación para trazar una operación a través de todos
  # los componentes: el Gateway lo genera si el cliente no lo trae, Identity lo
  # propaga a sus logs y al evento `user.created` de RabbitMQ. Sin esto, cruzar
  # un signup fallido entre los logs de tres repos es adivinanza.
  - name: correlation-id
    config:
      header_name: X-Correlation-Id
      generator: uuid
      # Se devuelve también al cliente: si la app reporta un error, el
      # identificador que ve el usuario es el mismo que está en los logs.
      echo_downstream: true

  # Rate limiting perimetral por IP de cliente. Primera línea de defensa contra
  # fuerza bruta y abuso automatizado sobre cualquier endpoint.
  - name: rate-limiting
    config:
      minute: ${RATE_LIMIT_PER_MINUTE}
      # `local`: el contador vive en la memoria compartida del nodo. Es la única
      # política coherente en DB-less mononodo; al escalar horizontalmente se
      # migra a `redis` sin tocar el resto de la configuración.
      policy: local
      limit_by: ip
      # Si el backend del contador falla, no se corta el tráfico legítimo.
      fault_tolerant: true
      # Se exponen los headers RateLimit-* para que la app pueda hacer backoff.
      hide_client_headers: false
      error_code: 429
      error_message: "API rate limit exceeded"
