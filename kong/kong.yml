# ─────────────────────────────────────────────────────────────────────────────
# Configuración declarativa de Kong (modo DB-less).
#
# Este archivo es una plantilla: los placeholders ${VARIABLE} se resuelven en
# el arranque del contenedor (docker/entrypoint.sh) contra las variables de
# entorno, y el resultado se escribe en `declarative_config` (kong.conf).
# Nunca se versionan secretos acá.
# ─────────────────────────────────────────────────────────────────────────────
_format_version: "3.0"
_transform: true

services:
  # ── vinculo-vial-identity ──────────────────────────────────────────────────
  # Servicio de identidad: registro, autenticación y gestión de usuarios.
  - name: identity-service
    url: ${IDENTITY_SERVICE_URL}
    # El registro es una operación no idempotente (crea un usuario): sólo se
    # reintenta ante fallos de conexión, nunca ante una respuesta del upstream.
    retries: 1
    connect_timeout: 5000
    write_timeout: 15000
    read_timeout: 15000
    routes:
      # US-01 — Registro. El body es un sobre HPKE: el Gateway no lo inspecciona
      # ni lo modifica, sólo lo reenvía.
      - name: identity-signup
        methods:
          - POST
        paths:
          - /api/v1/auth/signup
        # La ruta pública y la del upstream son idénticas: no se recorta el path.
        strip_path: false
        # El upstream recibe su propio Host, no el del cliente.
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          # Techo de tamaño específico de esta Route, más ajustado que el piso
          # global de nginx (kong.conf). Deliberadamente por Route y no global:
          # Kong corre TODAS las instancias de un mismo plugin que apliquen a
          # una request (global + Route no es "el más específico gana", son
          # las dos), así que un `request-size-limiting` global sumado a éste
          # limitaría todo por el menor de los dos. Mismo motivo que
          # `rate-limiting` es sólo global y `app-attestation` es sólo por
          # Route.
          #
          # Prioridad nativa 951: corre antes que `rate-limiting` (910) y que
          # `app-attestation` (900), así que un body de más de
          # `SIGNUP_MAX_BODY_MB` se rechaza sin gastar cuota de rate limit ni
          # una llamada a Google.
          - name: request-size-limiting
            config:
              allowed_payload_size: ${SIGNUP_MAX_BODY_MB}
              size_unit: megabytes
              require_content_length: false

          # Esta Route no tiene `token-offloading`, así que nada más
          # descartaría un `X-User-Hash`/`X-User-Id` que un cliente mande
          # desde afuera — ver "Headers de identidad" en el README. Antes
          # era un `request-transformer` global (una sola instancia para
          # toda la plataforma); pasó a declararse por Route, igual que el
          # resto de los plugins, porque un global corría en prioridad 801,
          # entre `rate-limiting` (910) y `token-offloading`, y esa posición
          # fija impedía subir la prioridad de `token-offloading` por encima
          # de `rate-limiting` sin que este plugin le borrara el header
          # recién escrito antes de reenviar al upstream (US-05).
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Hash
                  - X-User-Id

          # Seguridad perimetral: sin una atestación válida de Play Integrity
          # la request no alcanza la red interna.
          - name: app-attestation
            config:
              source: ${ATTESTATION_SOURCE}
              package_name: ${PLAY_PACKAGE_NAME}
              service_account_path: ${GOOGLE_SERVICE_ACCOUNT_PATH}
              playintegrity_url: ${PLAY_INTEGRITY_URL}
              ssl_verify: ${ATTESTATION_SSL_VERIFY}
              # Sólo se usa con source = mock (CI y desarrollo aislado).
              psk: "${APP_ATTESTATION_PSK}"
              accepted_app_verdicts: ${ATTESTATION_APP_VERDICTS}
              accepted_device_verdicts: ${ATTESTATION_DEVICE_VERDICTS}
              max_age_seconds: ${ATTESTATION_MAX_AGE_SECONDS}
              request_hash_encoding: ${ATTESTATION_REQUEST_HASH_ENCODING}

      # US-02 — Login. Mismo esquema de body que signup: sobre HPKE, el
      # Gateway no lo inspecciona ni lo modifica, sólo lo reenvía. Identity
      # emite el Access Token (JWT RS256, 15 min) y el Refresh Token (opaco,
      # 30 días) — el Gateway no participa de esa emisión, sólo perimetra el
      # endpoint.
      - name: identity-signin
        methods:
          - POST
        paths:
          - /api/v1/auth/signin
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          # Techo propio, más chico que el de signup: este body no lleva una
          # selfie, sólo credenciales. Mismo motivo que en signup para correr
          # antes que `app-attestation` — un límite bajo en bytes es barato de
          # aplicar y evita gastar una llamada a Google en un body imposible.
          - name: request-size-limiting
            config:
              allowed_payload_size: ${SIGNIN_MAX_BODY_KB}
              size_unit: kilobytes
              require_content_length: false

          # Igual que en signup: sin `token-offloading`, esta Route necesita
          # su propio descarte de `X-User-Hash`/`X-User-Id` (ver comentario
          # equivalente en `identity-signup`, más arriba).
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Hash
                  - X-User-Id

          # Mismo perímetro que signup: el login es, si no más, un blanco
          # igual de natural de fuerza bruta y credential stuffing, y encima
          # es el endpoint que primero emite tokens de sesión.
          - name: app-attestation
            config:
              source: ${ATTESTATION_SOURCE}
              package_name: ${PLAY_PACKAGE_NAME}
              service_account_path: ${GOOGLE_SERVICE_ACCOUNT_PATH}
              playintegrity_url: ${PLAY_INTEGRITY_URL}
              ssl_verify: ${ATTESTATION_SSL_VERIFY}
              # Sólo se usa con source = mock (CI y desarrollo aislado).
              psk: "${APP_ATTESTATION_PSK}"
              accepted_app_verdicts: ${ATTESTATION_APP_VERDICTS}
              accepted_device_verdicts: ${ATTESTATION_DEVICE_VERDICTS}
              max_age_seconds: ${ATTESTATION_MAX_AGE_SECONDS}
              request_hash_encoding: ${ATTESTATION_REQUEST_HASH_ENCODING}

      # US-03 — Gestión de Sesión (RTR). El body es `{ "refresh_token": "<...>" }`,
      # un string opaco SIN el sobre HPKE de signup/signin: la confidencialidad
      # la aporta HTTPS, no el Gateway. Identity emite un par nuevo (Access +
      # Refresh Token, rotado) o responde 401/403 — el Gateway no participa de
      # esa lógica, sólo perimetra el endpoint.
      - name: identity-refresh
        methods:
          - POST
        paths:
          - /api/v1/auth/refresh
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          # Igual que en signup/signin: sin `token-offloading`, esta Route
          # necesita su propio descarte de `X-User-Hash`/`X-User-Id` (ver
          # comentario equivalente en `identity-signup`, más arriba).
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Hash
                  - X-User-Id

          # Mismo perímetro que signup/signin: emitir un par de tokens de
          # sesión nuevo amerita la misma exigencia de atestación.
          - name: app-attestation
            config:
              source: ${ATTESTATION_SOURCE}
              package_name: ${PLAY_PACKAGE_NAME}
              service_account_path: ${GOOGLE_SERVICE_ACCOUNT_PATH}
              playintegrity_url: ${PLAY_INTEGRITY_URL}
              ssl_verify: ${ATTESTATION_SSL_VERIFY}
              # Sólo se usa con source = mock (CI y desarrollo aislado).
              psk: "${APP_ATTESTATION_PSK}"
              accepted_app_verdicts: ${ATTESTATION_APP_VERDICTS}
              accepted_device_verdicts: ${ATTESTATION_DEVICE_VERDICTS}
              max_age_seconds: ${ATTESTATION_MAX_AGE_SECONDS}
              request_hash_encoding: ${ATTESTATION_REQUEST_HASH_ENCODING}

      # Deliberadamente SIN `app-attestation`: cerrar sesión es una acción de
      # seguridad del usuario, no una operación que emita credenciales nuevas.
      # Si el dispositivo perdiera su capacidad de atestar (o el mock/Play
      # Integrity fallara), el usuario tiene que poder revocar igual su propio
      # Refresh Token — lo contrario lo dejaría atrapado sin poder cerrar
      # sesión justo cuando más lo necesita (robo de dispositivo). El riesgo
      # residual es bajo: quien ya posee el token sólo puede invalidarlo, lo
      # cual no da acceso a nada.
      #
      # Regla del repo: `app-attestation` se declara siempre por Route, nunca
      # a nivel de Service — si estuviera en `identity-service`, se heredaría
      # también acá y no habría forma de eximir esta Route puntual.
      - name: identity-logout
        methods:
          - POST
        paths:
          - /api/v1/auth/logout
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          # Sin `app-attestation` pero igual sin `token-offloading`: sigue
          # necesitando su propio descarte de `X-User-Hash`/`X-User-Id` (ver
          # comentario equivalente en `identity-signup`, más arriba).
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Hash
                  - X-User-Id

      # ── Scaffolding de Token Offloading ──────────────────────────────────
      # Ruta de ejemplo de un endpoint con sesión, para dejar el patrón
      # armado: no aplica a US-01/US-02/US-03 (signup, signin, refresh y
      # logout se autentican con el Refresh Token o no requieren sesión,
      # nunca con el Access Token entrante). El par `jwt` + `token-offloading`
      # es el que se replica en cada endpoint autenticado de la plataforma —
      # `vehicles-route` (US-04, más abajo) es el primer caso real.
      - name: identity-profile
        methods:
          - GET
        paths:
          - /api/v1/users/me
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          # Verifica la firma RS256 contra la clave pública de Identity.
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          # Traduce el `sub` ya validado a `X-User-Hash` y quita el
          # `Authorization` antes de reenviar.
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Hash
              remove_authorization: true

  # ── vinculo-vial-vehicle ────────────────────────────────────────────────────
  # US-04 — Vinculación de Vehículo. Primer CU con Token Offloading real: el
  # body es un sobre HPKE con cifrado diferenciado (`dni_enc` para Identity,
  # `pat_enc` para Vehicle) que el Gateway no inspecciona ni modifica, sólo
  # reenvía. `/internal/verify-ownership` (Vehicle → Identity) es tráfico
  # interno directo, nunca una Route de Kong — ver más abajo.
  - name: vehicle-service
    url: ${VEHICLE_SERVICE_URL}
    # La vinculación de vehículo es una operación no idempotente (crea el
    # registro de vinculación): mismo criterio que `identity-service`, sólo se
    # reintenta ante fallos de conexión, nunca ante una respuesta del upstream.
    retries: 1
    connect_timeout: 5000
    write_timeout: 15000
    read_timeout: 15000
    routes:
      - name: vehicles-route
        methods:
          - POST
        paths:
          - /api/v1/vehicles
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          # Verifica la firma RS256 del Access Token contra la clave pública
          # de Identity. Mismo par jwt + token-offloading que el scaffold de
          # /users/me, ahora en su primer uso real.
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          # Traduce el `sub` ya validado a `X-User-Id` y quita el
          # `Authorization` antes de reenviar. Es la ÚNICA protección contra
          # spoofing de este header en esta Route —no hay además un
          # `request-transformer` global ni por Route—: el propio plugin
          # descarta cualquier `X-User-Id` entrante antes de escribir el suyo
          # (kong/plugins/token-offloading/handler.lua), en un único
          # `access()` atómico. Sin eso, un atacante podría mandar su propio
          # `X-User-Id` y vincular un vehículo a la cuenta de otro usuario.
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true

      # No existe ninguna Route que matchee `/internal/*`: el endpoint
      # interno `/internal/verify-ownership` (Vehicle → Identity) no se
      # expone en Kong a propósito, y una request a través del proxy tiene
      # que devolver 404 de Kong, sin llegar nunca a la red interna. La
      # ausencia de Route impide el acceso desde AFUERA, pero no aísla el
      # endpoint dentro de la red Docker — cualquier contenedor puede
      # llamar a Identity directamente; ese aislamiento es responsabilidad
      # de Identity (puerto interno separado y/o secreto servicio a
      # servicio, documentado en su propio CLAUDE.md). Kong cubre sólo la
      # mitad perimetral del problema.

  # ── vinculo-vial-alert ────────────────────────────────────────────────────
  # US-05 — Escaneo de Patente y Alerta Anónima. El body es
  # `{ "alert_type": "...", "pat_enc": "<cripto para Vehicle>" }`: el
  # Gateway no lo inspecciona ni modifica, sólo reenvía. `pat_enc` sólo lo
  # puede abrir Vehicle — Alert lo reenvía a ciegas a
  # `/internal/resolve-owner` por red interna directa, nunca a través de
  # una Route de Kong.
  #
  # US-07 — Buzón de Alertas (lectura), sobre el mismo Service: ver
  # `alerts-inbox-route`, más abajo.
  - name: alert-service
    url: ${ALERT_SERVICE_URL}
    # El alta de alerta es una operación no idempotente: mismo criterio que
    # `identity-service`, sólo se reintenta ante fallos de conexión, nunca
    # ante una respuesta del upstream.
    retries: 1
    connect_timeout: 5000
    write_timeout: 15000
    read_timeout: 15000
    routes:
      # Deliberadamente SIN `app-attestation`: decisión cerrada del
      # contrato de US-05, por velocidad. Sin esa capa, `rate-limiting`
      # por usuario deja de ser una cortesía operativa y pasa a ser la
      # única defensa contra abuso automatizado sobre este endpoint —
      # de ahí que corra con un límite mucho más estricto que el
      # perimetral por IP (plugin global, más abajo).
      - name: alerts-route
        methods:
          - POST
        paths:
          - /api/v1/alerts
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          # Mismo par que vehicles-route: verifica la firma RS256 del
          # Access Token contra la clave pública de Identity.
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          # Traduce el `sub` ya validado a `X-User-Id` y quita el
          # `Authorization` antes de reenviar. Corre en PRIORITY 1000
          # (kong/plugins/token-offloading/handler.lua) — por encima de
          # `rate-limiting` (910, nativo) — para que el header ya esté
          # escrito cuando ese plugin lea `limit_by: header` más abajo.
          # Es también la única protección contra spoofing de este header
          # en esta Route, igual que en vehicles-route.
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true
          # Anti-abuso por usuario, no por IP: sin `app-attestation`,
          # cualquiera con un JWT válido podría barrer el endpoint. El
          # cupo es independiente por `X-User-Id` — dos usuarios distintos
          # nunca comparten contador.
          - name: rate-limiting
            config:
              minute: 5
              hour: 10
              limit_by: header
              header_name: X-User-Id
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"

      # US-07 — Buzón de Alertas (lectura). Comparte prefijo con
      # `alerts-route` (`/api/v1/alerts`), pero Kong resuelve por método
      # además de por path: `alerts-route` declara `methods: [POST]` de
      # forma explícita (más arriba), así que un `GET` nunca puede
      # matchearla, sin importar la especificidad del path. Verificado
      # también con un test de integración dedicado.
      - name: alerts-inbox-route
        methods:
          - GET
        paths:
          - /api/v1/alerts/inbox
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          # Mismo par que alerts-route: verifica la firma RS256 del Access
          # Token e inyecta `X-User-Id` a partir del `sub` ya validado. La
          # paginación (`limit`/`cursor`) viaja en la query string sin que
          # el Gateway la toque: el recorte del `limit` al tope y la
          # validación del `cursor` son responsabilidad de Alert, no de
          # este perímetro.
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true
          # 20/min: más permisivo que los 5/min de alerts-route porque este
          # endpoint es de lectura, idempotente y sin efectos — y sólo
          # devuelve datos que ya pertenecen al usuario autenticado, a
          # diferencia de alerts-route, que sí necesita un límite estricto
          # por no tener `app-attestation` delante. Depende de la misma
          # PRIORITY=1000 de `token-offloading` que alerts-route: si ese
          # plugin corriera después de `rate-limiting`, el límite por
          # usuario degradaría en silencio a otro criterio.
          - name: rate-limiting
            config:
              minute: 20
              limit_by: header
              header_name: X-User-Id
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"

      # Igual que con Vehicle: no existe ninguna Route que matchee
      # `/internal/*`. `/internal/resolve-owner` (Alert → Vehicle) es
      # tráfico interno directo, nunca expuesto en Kong.

  # ── vinculo-vial-notification ───────────────────────────────────────────────
  # US-06 — Registro y baja de tokens FCM. El body de POST es
  # `{ "fcm_token": "<...>" }`, sin cifrado propio: el token FCM no es un dato
  # sensible en el sentido HPKE del resto de la plataforma, así que el Gateway
  # lo reenvía intacto sin más tratamiento que el perímetro de sesión.
  - name: notification-service
    url: ${NOTIFICATION_SERVICE_URL}
    # El alta de token FCM es una operación no idempotente: mismo criterio que
    # `identity-service`, sólo se reintenta ante fallos de conexión, nunca
    # ante una respuesta del upstream.
    retries: 1
    connect_timeout: 5000
    write_timeout: 15000
    read_timeout: 15000
    routes:
      # Alta de token. Sin `app-attestation` — mismo criterio que /vehicles y
      # /alerts: la sesión (jwt + token-offloading) ya exige un Access Token
      # válido, y acá el rate-limiting por usuario cierra el resto del
      # perímetro (ver más abajo).
      - name: notification-tokens-post-route
        methods:
          - POST
        paths:
          - /api/v1/notifications/tokens
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          # Mismo par que vehicles-route y alerts-route: verifica la firma
          # RS256 del Access Token e inyecta `X-User-Id` a partir del `sub`
          # ya validado.
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true
          # 10/día: un token FCM rota con poca frecuencia (reinstalación,
          # restauración de backup, limpieza de datos de la app). Diez altas
          # diarias por usuario es holgado para el uso legítimo y acota el
          # abuso de escritura sobre este endpoint, que no tiene
          # `app-attestation` por delante. Depende de la misma PRIORITY=1000
          # de `token-offloading` que /alerts y /alerts/inbox: si ese plugin
          # corriera después de `rate-limiting`, el límite por usuario
          # degradaría en silencio a otro criterio (ver
          # `kong/plugins/token-offloading/handler.lua`).
          - name: rate-limiting
            config:
              day: 10
              limit_by: header
              header_name: X-User-Id
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: "API rate limit exceeded"

      # Baja de token. Deliberadamente SIN `rate-limiting`: un límite
      # alcanzado acá deja al dispositivo recibiendo notificaciones que ya no
      # le corresponden — fuga de privacidad, no una molestia. Mismo criterio
      # que eximir `/auth/logout` de `app-attestation`. Route separada de la
      # de alta (no un único `POST`+`DELETE` compartido) precisamente para
      # que el rate-limiting de arriba no se herede también acá.
      - name: notification-tokens-delete-route
        methods:
          - DELETE
        paths:
          - /api/v1/notifications/tokens
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: true
          - name: token-offloading
            config:
              claim: sub
              header_name: X-User-Id
              remove_authorization: true

      # No existe ninguna Route que matchee `/internal/*`, mismo criterio que
      # en Vehicle y Alert.

# ── Consumers ────────────────────────────────────────────────────────────────
# En este modelo el emisor de los tokens es Identity, no cada usuario final: el
# Gateway sólo necesita la clave pública para verificar la firma, y la
# identidad del usuario viaja en el claim `sub`.
consumers:
  - username: vinculo-vial-identity
    jwt_secrets:
      - key: ${JWT_ISSUER}
        algorithm: RS256
        rsa_public_key: "${JWT_PUBLIC_KEY}"

# ── Plugins globales ─────────────────────────────────────────────────────────
# Sin `service` ni `route` asociados: aplican a todo el tráfico que atraviesa el
# Gateway, para toda la plataforma.
plugins:
  # Identificador de correlación para trazar una operación a través de todos
  # los componentes: el Gateway lo genera si el cliente no lo trae, Identity lo
  # propaga a sus logs y al evento `user.created` de RabbitMQ. Sin esto, cruzar
  # un signup fallido entre los logs de tres repos es adivinanza.
  - name: correlation-id
    config:
      header_name: X-Correlation-Id
      generator: uuid
      # Se devuelve también al cliente: si la app reporta un error, el
      # identificador que ve el usuario es el mismo que está en los logs.
      echo_downstream: true

  # Rate limiting perimetral por IP de cliente. Primera línea de defensa contra
  # fuerza bruta y abuso automatizado sobre cualquier endpoint.
  - name: rate-limiting
    config:
      minute: ${RATE_LIMIT_PER_MINUTE}
      # `local`: el contador vive en la memoria compartida del nodo. Es la única
      # política coherente en DB-less mononodo; al escalar horizontalmente se
      # migra a `redis` sin tocar el resto de la configuración.
      policy: local
      limit_by: ip
      # Si el backend del contador falla, no se corta el tráfico legítimo.
      fault_tolerant: true
      # Se exponen los headers RateLimit-* para que la app pueda hacer backoff.
      hide_client_headers: false
      error_code: 429
      error_message: "API rate limit exceeded"
