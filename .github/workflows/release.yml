# Publica la imagen del Gateway a Docker Hub.
#
# `publish` depende de `tests` (la misma suite que corre en cada PR, reusada
# vía `workflow_call`): no hay build-and-push directo, la publicación exige
# que unitarios, arranque de Kong e integración contra el stub de Google
# hayan pasado para ESTE commit puntual.
#
# Se dispara con:
#   - push a `main` (después de un merge)      -> publica `latest` + `sha-<corto>`
#   - push de un tag `vX.Y.Z`                   -> además publica ese tag exacto
name: release

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Mínimo privilegio a nivel workflow; el job que necesite más lo declara aparte.
# También acota lo que puede pedir `tests.yml`, que se invoca desde acá.
permissions:
  contents: read

# Un push a main y su tag correspondiente pueden disparar dos corridas casi
# simultáneas sobre el mismo contenido; no tiene sentido cancelarse entre sí
# (cada una construye un set de tags distinto), así que el grupo de
# concurrencia es por SHA, no por rama.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests (gate de publicación)
    uses: ./.github/workflows/tests.yml

  publish:
    name: Build y push a Docker Hub
    needs: [tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # El driver `docker` por defecto no soporta `cache-to: type=gha` (falla
      # con "Cache export is not supported for the docker driver"). Un builder
      # de buildx explícito sí lo soporta.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # `latest` y el SHA corto se publican siempre. El tag semántico sólo
      # cuando el disparador fue un push de tag `vX.Y.Z` — `github.ref_name`
      # es el nombre del tag en ese caso, o el de la rama (`main`) si no.
      - name: Preparar los tags de la imagen
        id: tags
        env:
          IMAGE: felaufernandezbottaro/vinculo-vial-gateway
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          short="$(git rev-parse --short=7 HEAD)"
          tags="${IMAGE}:latest,${IMAGE}:sha-${short}"
          if [ "${IS_TAG}" = "true" ]; then
            tags="${tags},${IMAGE}:${REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      # Se construye ANTES de autenticarse. Si el login fuera antes, esas
      # credenciales quedarían activas también para el `FROM kong:3.7` de más
      # abajo: un token de Docker Hub scopeado a los repos de
      # felaufernandezbottaro rechaza el pull de una imagen pública ajena a
      # ese scope ("access token has insufficient scopes"), aunque cualquiera
      # sin loguearse la baja sin problema. `load: true` importa el resultado
      # al daemon local, para poder pushearlo recién después del login.
      - name: Build (sin autenticar; evita el pull de kong:3.7 con un token de scope ajeno)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          # Cache entre corridas: evita recompilar capas que no cambiaron
          # (la instalación de paquetes apt, sobre todo). No requiere estar
          # autenticado contra Docker Hub: es el backend de cache de GitHub
          # Actions, no un registry.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        run: |
          for tag in $(echo "${{ steps.tags.outputs.tags }}" | tr ',' ' '); do
            docker push "${tag}"
          done
