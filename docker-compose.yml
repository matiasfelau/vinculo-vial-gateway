# ─────────────────────────────────────────────────────────────────────────────
# Un único servicio: Kong en modo DB-less.
#
# No hay Postgres (DB-less no lo necesita) ni RabbitMQ (el Gateway no publica
# ni consume eventos): no hay contenedores secundarios ni volúmenes
# persistentes que nombrar en este repo.
#
# La red `vinculo-vial` es la red puente compartida por toda la plataforma —
# NINGÚN repo la crea desde su propio compose (`external: true`): existe de
# antemano en el host, provista una única vez fuera de cualquier compose
# individual (ver "Puesta en marcha" en el README para el bootstrap local).
# ─────────────────────────────────────────────────────────────────────────────
name: vinculo-vial-gateway

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: vinculo-vial-gateway:local
    container_name: vinculo-vial-gateway
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Credenciales de Google. Se montan como archivo de sólo lectura en vez
      # de pasarse por entorno: la clave privada del service account no tiene
      # por qué estar en el ambiente del proceso ni en la config declarativa.
      # `./secrets` no se versiona; ver .env.example.
      - ./secrets:/etc/vinculo-vial:ro
    ports:
      # Proxy: único punto de entrada público de la plataforma.
      - "${GATEWAY_PROXY_PORT:-8000}:8000"
      # Status API (sólo lectura): únicamente desde el host, nunca desde la red.
      - "127.0.0.1:${GATEWAY_STATUS_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8100/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vinculo-vial

networks:
  # Externa: este compose se conecta a la red de la plataforma, no la crea.
  # Si no existe todavía en el host, `docker compose up` falla explícitamente
  # ("network vinculo-vial declared as external, but could not be found") en
  # vez de crear una red aislada con el mismo nombre por accidente — que es
  # justamente la inconsistencia que esta convención busca eliminar.
  vinculo-vial:
    name: vinculo-vial
    external: true
