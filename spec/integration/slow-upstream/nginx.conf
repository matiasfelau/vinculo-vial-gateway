# Upstream deliberadamente lento: nunca responde dentro del read_timeout de
# ningún Service de kong.yml (9000ms, el más alto de los cuatro). Lo único
# que importa de esta imagen es cuántas veces Kong efectivamente abre una
# conexión y entrega el request acá — eso es lo que decide si `retries: 1`
# puede causar una doble entrega de una escritura no idempotente, o si el
# reintento de Kong sólo aplica a fallos de conexión y nunca llega a tocar
# este upstream una segunda vez.
#
# El marcador se loguea ANTES de dormir, no después: así el conteo por
# `docker logs | grep` es exacto apenas Kong corta por timeout, sin depender
# de que termine el `sleep` (que sigue corriendo en segundo plano, ajeno al
# timeout de Kong, por `lua_check_client_abort` apagado por defecto).
#
# `/ready` es la ÚNICA excepción: responde al toque, sin dormir. El
# healthcheck activo del Upstream de Kong (ver kong.yml) sondea ese path
# directo contra este contenedor, por fuera de cualquier Route, con un
# intervalo mucho más corto que el sleep de abajo — si cayera en el mismo
# `location /`, el target se marcaría no sano antes de que el propio test
# llegue a mandar su request, y Kong cortaría con 503 del balanceador en vez
# del 504 por timeout que este test verifica.

worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/slow/nginx.pid;

events {
  worker_connections 16;
}

http {
  access_log /dev/stdout;

  server {
    listen 8080;

    location = /ready {
      return 200;
    }

    location / {
      content_by_lua_block {
        ngx.log(ngx.NOTICE, "slow-upstream: invocacion recibida")

        -- Más que el read_timeout más alto de los cuatro Services (9000ms),
        -- con margen: garantiza que cualquier intento (el primero o un
        -- eventual reintento) agote el timeout de Kong sin que este upstream
        -- llegue a responder a tiempo.
        ngx.sleep(18)

        ngx.header["Content-Type"] = "application/json"
        ngx.say('{"ok":true}')
      }
    }
  }
}
