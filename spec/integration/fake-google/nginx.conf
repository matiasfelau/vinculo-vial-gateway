# Stub de las dos APIs de Google que consume el plugin `app-attestation`.
#
# No es un mock de la librería: es un servidor HTTP real, así que el test
# ejercita el camino completo — firma de la aserción del service account,
# canje por el access token, POST a decodeIntegrityToken, parseo de la
# respuesta — que los tests unitarios no pueden cubrir.
#
# Emula a Google en lo que importa: devuelve como `requestHash` exactamente lo
# que la app embebió en el token. Por eso el "token de integridad" del test es
# el propio hash, y el stub lo refleja.

worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/stub/nginx.pid;

events {
  worker_connections 128;
}

http {
  access_log /dev/stdout;
  lua_package_path "/usr/local/share/lua/5.1/?.lua;;";

  # Estado que el test cambia en caliente (ver /control/token-delay): demorar
  # el canje de OAuth permite verificar cómo se reparte el presupuesto del par
  # de llamadas sin tocar la configuración del stub entre casos.
  lua_shared_dict stub_state 1m;

  server {
    listen 8080;

    # Demora artificial del canje de OAuth, en ms. 0 la apaga.
    location = /control/token-delay {
      content_by_lua_block {
        local ms = tonumber(ngx.req.get_uri_args().ms) or 0
        ngx.shared.stub_state:set("token_delay_ms", ms)
        ngx.say("ok")
      }
    }

    # ── oauth2.googleapis.com/token ──────────────────────────────────────────
    location = /token {
      content_by_lua_block {
        local cjson = require "cjson.safe"

        local delay_ms = ngx.shared.stub_state:get("token_delay_ms") or 0
        if delay_ms > 0 then
          ngx.sleep(delay_ms / 1000)
        end

        ngx.req.read_body()

        -- Se parsea el form en vez de buscar substrings: `grant-type` tiene un
        -- guión, que en un patrón de Lua es un cuantificador y no un literal.
        local args = ngx.req.get_post_args() or {}

        local function fail(reason)
          ngx.status = 400
          ngx.say(cjson.encode({ error = "invalid_request", detail = reason }))
        end

        if args.grant_type ~= "urn:ietf:params:oauth:grant-type:jwt-bearer" then
          return fail("grant_type inesperado: " .. tostring(args.grant_type))
        end

        -- La aserción tiene que ser un JWT compacto firmado con RS256 y con el
        -- `kid` del service account: si el Gateway la armara mal, este stub lo
        -- delata en vez de aceptar cualquier cosa.
        local assertion = args.assertion
        if type(assertion) ~= "string" then
          return fail("falta la aserción")
        end

        local header_b64, claims_b64 =
          assertion:match("^([%w_%-]+)%.([%w_%-]+)%.([%w_%-]+)$")
        if not header_b64 then
          return fail("la aserción no es un JWT compacto")
        end

        local function decode_segment(segment)
          local padded = segment:gsub("%-", "+"):gsub("_", "/")
          local remainder = #padded % 4
          if remainder == 2 then
            padded = padded .. "=="
          elseif remainder == 3 then
            padded = padded .. "="
          end
          return cjson.decode(ngx.decode_base64(padded) or "") or {}
        end

        local header = decode_segment(header_b64)
        if header.alg ~= "RS256" then
          return fail("alg inesperado: " .. tostring(header.alg))
        end
        if header.kid ~= "stub-key-id" then
          return fail("kid inesperado: " .. tostring(header.kid))
        end

        local claims = decode_segment(claims_b64)
        if claims.scope ~= "https://www.googleapis.com/auth/playintegrity" then
          return fail("scope inesperado: " .. tostring(claims.scope))
        end
        if type(claims.exp) ~= "number" or claims.exp <= ngx.time() then
          return fail("la aserción no está vigente")
        end

        ngx.header["Content-Type"] = "application/json"
        ngx.say(cjson.encode({
          access_token = "ya29.stub-access-token",
          expires_in = 3599,
          token_type = "Bearer",
        }))
      }
    }

    # ── playintegrity.googleapis.com/v1/{pkg}:decodeIntegrityToken ───────────
    location ~ "^/v1/(?<package_name>[^:]+):decodeIntegrityToken$" {
      content_by_lua_block {
        local cjson = require "cjson.safe"

        -- El body se lee ANTES de validar el Authorization real: la
        -- escotilla UNAUTHORIZED necesita el token del request para decidir
        -- simular un 401 aunque el access token que mandó el Gateway en
        -- este request puntual sea válido.
        ngx.req.read_body()
        local request = cjson.decode(ngx.req.get_body_data() or "{}") or {}
        local token = request.integrity_token or ""

        -- Escotilla para forzar que Google rechace NUESTRO access token
        -- (credenciales propias inválidas), más allá de que el de este
        -- request real sí lo sea.
        if token == "UNAUTHORIZED" then
          ngx.status = 401
          ngx.say(cjson.encode({ error = { code = 401 } }))
          return
        end

        -- Escotilla para simular a Google colgado: no responde dentro de
        -- ningún techo del Gateway (el mayor es de 4000ms). Responde 503
        -- recién después, cuando ya nadie lo espera.
        if token == "SLOW" then
          ngx.sleep(5)
          ngx.status = 503
          ngx.say("slow")
          return
        end

        if ngx.var.http_authorization ~= "Bearer ya29.stub-access-token" then
          ngx.status = 401
          ngx.say(cjson.encode({ error = { code = 401 } }))
          return
        end

        -- Escotillas para forzar los caminos de error de Google.
        if token == "REJECT" then
          ngx.status = 400
          ngx.say(cjson.encode({ error = { code = 400, message = "invalid token" } }))
          return
        end

        if token == "BOOM" then
          ngx.status = 503
          ngx.say("unavailable")
          return
        end

        -- Prefijo `NOPKG:` — emula a la Standard API cuando devuelve el
        -- veredicto sin `requestDetails.requestPackageName`, dejando la
        -- identidad de la app sólo en `appIntegrity.packageName`.
        local omit_request_package = false
        if token:sub(1, 6) == "NOPKG:" then
          omit_request_package = true
          token = token:sub(7)
        end

        -- Prefijo `OTHERPKG:` — emula lo comprobado contra Google real: la API
        -- devuelve 200 con un veredicto válido aunque el token lo haya
        -- generado OTRA app. El package de la respuesta es el de la app que
        -- pidió el token, no el de la URL.
        local foreign_package
        if token:sub(1, 9) == "OTHERPKG:" then
          foreign_package = "com.atacante.app"
          token = token:sub(10)
        end

        -- El token del test tiene la forma "<requestHash>[|<veredictos>]".
        local request_hash, verdicts = token:match("^([^|]*)|?(.*)$")

        local device_verdict = {}
        if verdicts == "" then
          device_verdict = { "MEETS_DEVICE_INTEGRITY" }
        elseif verdicts ~= "NONE" then
          for verdict in verdicts:gmatch("[^,]+") do
            device_verdict[#device_verdict + 1] = verdict
          end
        end

        -- Salvo que el caso pida un package ajeno, el veredicto refleja el de
        -- la URL, que es lo que hace Google cuando el token sí es de esa app.
        local package_name = foreign_package
          or ngx.unescape_uri(ngx.var.package_name)

        ngx.header["Content-Type"] = "application/json"
        ngx.say(cjson.encode({
          tokenPayloadExternal = {
            requestDetails = {
              requestPackageName = (not omit_request_package)
                and package_name or nil,
              requestHash = request_hash,
              timestampMillis = tostring(ngx.now() * 1000),
            },
            appIntegrity = {
              appRecognitionVerdict = "PLAY_RECOGNIZED",
              packageName = package_name,
              certificateSha256Digest = { "stub-cert-digest" },
              versionCode = "1",
            },
            deviceIntegrity = {
              deviceRecognitionVerdict = device_verdict,
            },
            accountDetails = {
              appLicensingVerdict = "LICENSED",
            },
          },
        }))
      }
    }
  }
}
