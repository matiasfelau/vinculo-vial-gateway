# Upstream de comportamiento controlable por el test, para verificar cómo el
# balanceador de Kong decide la salud de una instancia.
#
# `/ready` y las rutas de negocio responden cada uno con su propio status, que
# el test cambia en caliente por `/control`: es lo que permite probar que lo
# único que saca una instancia del balanceo es `/ready` (healthcheck activo) y
# no lo que responden las rutas de negocio (un 503 de contención por ruta, un
# 4xx).
#
#   /control?ready=503&business=400   fija el status de cada una
#
# Cada invocación a una ruta de negocio se loguea con un marcador que el test
# cuenta por `docker logs | grep -c`: distingue un 503 emitido por este
# upstream (el contador sube) de uno emitido por el balanceador de Kong sin
# tocar la red (el contador no se mueve).
#
# `/ready` no se loguea con el marcador a propósito: lo sondea el healthcheck
# activo cada segundo y contaminaría la cuenta.

worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/flaky/nginx.pid;

events {
  worker_connections 64;
}

http {
  access_log /dev/stdout;

  lua_shared_dict state 1m;

  server {
    listen 8080;

    location = /control {
      content_by_lua_block {
        local args = ngx.req.get_uri_args()

        for _, name in ipairs({ "ready", "business" }) do
          local value = tonumber(args[name])
          if value then
            ngx.shared.state:set(name, value)
          end
        end

        ngx.say("ok")
      }
    }

    location = /ready {
      content_by_lua_block {
        ngx.status = ngx.shared.state:get("ready") or 200
        ngx.say("ready")
      }
    }

    location / {
      content_by_lua_block {
        ngx.log(ngx.NOTICE, "flaky-upstream: invocacion recibida")
        ngx.req.read_body()

        local status = ngx.shared.state:get("business") or 200

        ngx.status = status
        ngx.header["Content-Type"] = "application/json"
        ngx.say('{"upstream_status":' .. status .. '}')
      }
    }
  }
}
